server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # youtube-source: REQUIRED by LavaSrc 4.x — replaces the built-in YouTube source.
    # Must be listed BEFORE lavasrc.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.1"
      repository: "https://maven.lavalink.dev/releases"
    # LavaSrc — adds Spotify, Apple Music, Yandex Music source support
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.3.0"
      repository: "https://maven.topi.wtf/releases"

  pluginsDir: "./plugins"

  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}   # Override via Render env var

    sources:
      youtube: false      # MUST stay false — youtube-source plugin handles YouTube
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    # Buffer sizes — tuned for free-tier (512 MB RAM / 300 MB heap).
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    opusEncodingQuality: 5       # 0–10; 5 = good quality, lower CPU than 10
    resamplingQuality: LOW        # Less CPU on small instances
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    soundcloudSearchEnabled: true
    gc-warnings: true

    httpConfig:
      proxyHost: ""
      proxyPort: 0
      proxyUser: ""
      proxyPassword: ""

plugins:
  # ── youtube-source plugin config ─────────────────────────────────────────────
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Client priority order — WEB and WEB_REMIX are intentionally excluded because
    # they require parsing YouTube's obfuscated player JS (player_embed.vflset),
    # which breaks whenever YouTube rotates their script hash.
    # TVHTML5EMBEDDED and ANDROID_TESTSUITE bypass that parsing step entirely.
    clients:
      - TVHTML5EMBEDDED        # TV embedded — most stable, no JS parsing needed
      - ANDROID_TESTSUITE      # Android test client — reliable fallback
      - IOS                    # iOS client — additional fallback
      - MUSIC                  # YouTube Music — for ytmsearch queries
    # Optional: add a YouTube account to avoid rate limits on busy servers
    oauth:
      enabled: false              # Set to true and add token below if you get 429s

  # ── LavaSrc plugin config ─────────────────────────────────────────────────────
  lavasrc:
    providers:
      # Resolution order: Spotify ISRC → SoundCloud → YouTube → YouTube Music
      - "spsearch:%ISRC%"          # Spotify by ISRC (best quality match)
      - "scsearch:%QUERY%"         # SoundCloud
      - "ytsearch:%QUERY%"         # YouTube
      - "ytmsearch:%QUERY%"        # YouTube Music

    sources:
      spotify: true
      applemusic: false            # Set true only if you add Apple credentials below
      deezer: false                # Set true only if you have a Deezer master key
      yandexmusic: false
      flowerytts: false
      youtube: true                # Uses the youtube-source plugin above

    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      countryCode: "US"
      playback: "LOCAL"
      spDc: ""                     # Optional Spotify cookie for higher rate limits

    deezer:
      masterDecryptionKey: ${DEEZER_MASTER_KEY:}

    applemusic:
      countryCode: "US"
      mediaAPIToken: ""

    yandexmusic:
      accessToken: ""

    flowerytts:
      voice: "Emma"
      translate: false
      silence: 0
      speed: 1.0
      audioFormat: "mp3"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000
