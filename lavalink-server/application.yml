server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  # No lavalink.plugins section needed — plugins are pre-downloaded into the
  # ./plugins/ directory by the Dockerfile and auto-loaded by Lavalink at boot.

  pluginsDir: "./plugins"

  server:
    # Set LAVALINK_PASSWORD (or LAVALLINK_PASSWORD) in your Render environment.
    # The Dockerfile ENTRYPOINT normalises both names before Java starts.
    password: ${LAVALINK_PASSWORD:youshallnotpass}

    sources:
      youtube: false      # MUST stay false — youtube-source plugin owns YouTube
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    # ── Low-resource tuning ───────────────────────────────────────────────────
    # These values are tuned for Render free/starter tier.
    # Increase bufferDurationMs and frameBufferDurationMs if you hear audio gaps
    # and are on a paid plan with more RAM.
    bufferDurationMs: 400
    frameBufferDurationMs: 2000
    opusEncodingQuality: 5        # 0–10; 5 is a good quality/CPU balance
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 3   # pages per playlist — keep low on free tier
    soundcloudSearchEnabled: true
    gc-warnings: true

    httpConfig:
      proxyHost: ""
      proxyPort: 0
      proxyUser: ""
      proxyPassword: ""

plugins:
  # ── youtube-source plugin ─────────────────────────────────────────────────
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # Client order matters — the plugin tries each in turn and uses the first
    # that succeeds.  WEB / WEB_REMIX are intentionally excluded (they require
    # parsing YouTube's obfuscated rotating player JS, which breaks frequently).
    # ANDROID_TESTSUITE and IOS are excluded as YouTube blocked / throttled them.
    clients:
      - TVHTML5EMBEDDED   # TV embedded iframe — most stable, no JS parsing
      - ANDROID_VR        # Android VR — bypasses many rate-limit checks
      - WEB_EMBEDDED      # Web embedded — no rotating-JS dependency
      - MUSIC             # YouTube Music — powers ytmsearch: queries

    # ── OAuth (STRONGLY recommended — eliminates most 429 / "unavailable" errors)
    #
    # HOW TO SET UP (takes ~2 minutes):
    #   1. Deploy to Render with YOUTUBE_OAUTH_ENABLED=true and NO refreshToken.
    #      Leave YOUTUBE_SKIP_INIT unset (or set to false).
    #   2. In your Render service → Logs, look for a line like:
    #        Visit the following URL to authorize YouTube: https://www.youtube.com/activate?user_code=XXXX-XXXX
    #   3. Open that URL in any browser, sign in to Google, click Allow.
    #   4. Back in Render logs you will see:
    #        OAuth token saved. Refresh token: eyJhb...
    #      Copy that refresh token.
    #   5. In Render → your Lavalink service → Environment, add:
    #        YOUTUBE_REFRESH_TOKEN = <paste the token>
    #        YOUTUBE_SKIP_INIT     = true        ← suppresses the prompt on future restarts
    #   6. Redeploy — OAuth is now active. Done.
    #
    # Leave YOUTUBE_OAUTH_ENABLED unset (defaults to false) to skip OAuth.
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      # skipInitialization:
      #   false (default) → Lavalink PRINTS the auth URL in logs when no token exists.
      #                      Use this on first deployment to get your token.
      #   true            → Lavalink skips the auth prompt (use after you have a token).
      skipInitialization: ${YOUTUBE_SKIP_INIT:false}

  # ── LavaSrc plugin ──────────────────────────────────────────────────────────
  lavasrc:
    providers:
      # Resolution order for Spotify / generic queries:
      - "spsearch:%ISRC%"   # Spotify by ISRC — exact match, best quality
      - "scsearch:%QUERY%"  # SoundCloud — reliable fallback
      - "ytsearch:%QUERY%"  # YouTube
      - "ytmsearch:%QUERY%" # YouTube Music

    sources:
      spotify: true
      applemusic: false     # Enable + add mediaAPIToken below if needed
      deezer: false         # Enable + add masterDecryptionKey if you have one
      yandexmusic: false
      flowerytts: false
      youtube: true         # Resolved via the youtube-source plugin above

    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      countryCode: "US"
      playback: "LOCAL"
      spDc: ""

    deezer:
      masterDecryptionKey: ${DEEZER_MASTER_KEY:}

    applemusic:
      countryCode: "US"
      mediaAPIToken: ""

    yandexmusic:
      accessToken: ""

    flowerytts:
      voice: "Emma"
      translate: false
      silence: 0
      speed: 1.0
      audioFormat: "mp3"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000
